[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-snowboarder-tracker"
version = "0.1.0"
description = "YOLO-based snowboarder detection and tracking pipeline."
requires-python = ">=3.9"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
